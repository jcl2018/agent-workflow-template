# Written by workflow-regression. It reads .loop/regression.tsv and .loop/regression-known.tsv.
name: regression
on:
  schedule:
    - cron: "17 */4 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "land, nightly or a row id; empty runs nightly (the ci_levels setting)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read  # the defect tests' pull request states
concurrency:
  group: regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # no token left in .git/config for a row to read
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the routine
        id: routine
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cron=$(python3 -c 'import json; print(json.load(open(".loop/config.json")).get("regression_cron") or "")' 2>/dev/null || true)
          if [ "$cron" = off ] && [ "$EVENT" = schedule ]; then  # off stops the schedule; a tag or a run by hand still runs
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "OFF: regression is off in .loop/config.json (regression_cron), so this run writes nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "on=true" >> "$GITHUB_OUTPUT"
          if [ -n "$cron" ] && [ "$cron" != "17 */4 * * *" ]; then
            said="SCHEDULE: this workflow runs on '17 */4 * * *' but .loop/config.json says '$cron'. Fix: python3 skills/workflow-regression/scripts/regression.py workflow"
            echo "::warning::$said"; echo "$said" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run the rows, and keep one issue per failing row
        if: steps.routine.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_RESULTS: ${{ runner.temp }}/regression-results.tsv  # the runner's own file, in no row's environment
          SUITE_TIME_FILE: ${{ runner.temp }}/suite-time.tsv  # a full run's time, kept as artifact suite-time for health
          REGRESSION_TARGET: ${{ inputs.target }}  # a run by hand; checked below, never put into a shell line
          REGRESSION_LEVELS: "nightly"  # the schedule and v* tags run ci_levels
        run: |
          here=$(mktemp -d)  # a private folder: what each row guards, read before any row runs
          cat > "$here/tests.py" <<'TESTS_PY_EOF'
          #!/usr/bin/env python3
          """List every regression test in one fixed format, grouped by feature.

          usage: tests.py <command> [--root DIR]

            list [--markdown|--tsv] [--kind K]  every test from the recorded runs, one group per feature; --kind requirement,
                                              workflow or defect lists only that kind
            summary --results FILE --took S   a GitHub run summary: one header with totals and the run time, then one table per
                                              feature, from that run's results file (id<TAB>state lines; # lines are skipped)
            issues [--write]                  read each defect test's issue or pull request state with gh; --write records them in
                                              .loop/regression-issues.tsv (link, state, date, reopened_at) for the wiki and the
                                              health report; a defect row whose open issue was reopened shows "failing (issue
                                              reopened)" until the issue closes or a run on a later day passes
            fixes --since REF                 one "Fixes #N: test ROW, seen failing DATE, passing" line per issue fixed since REF: a
                                              defect row added, or whose seen-failing date was set, since REF, that links the
                                              issue and passes in .loop/regression-runs.tsv (REG-6); the release notes list them

          A feature is the wiki page that holds the requirement a row guards (its goal, or its id); a row that guards none is in
          Other. Each test shows: test, kind (requirement, workflow or defect), what it guards (the requirement's ID and words, or the
          issue's link and state), what it checks, when it runs, its last result and date (then FLAKY when that result flipped on
          one clean commit, REG-9), and when it was seen failing.
          Stdlib only and self-contained: the regression workflow carries a copy of this file.
          """
          import argparse
          import datetime
          import glob
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import tempfile

          # No terminal, no waiting: a prompt from git or gh must fail, not block.
          os.environ.update(GIT_TERMINAL_PROMPT="0", GH_PROMPT_DISABLED="1", GIT_EDITOR="true", GIT_ASKPASS="true", SSH_ASKPASS="true")
          if not sys.stdin or not sys.stdin.isatty():
              os.dup2(os.open(os.devnull, os.O_RDONLY), 0)

          ID = re.compile(r"^[A-Z]{2,5}-\d+$")
          SEEN = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          KIND = {"criterion": "requirement", "workflow": "workflow", "defect": "defect"}  # category: kind
          RUNS = {"land": "both", "nightly": "nightly", "covered": "by a person"}
          STATES = ("PASS", "FAIL", "SKIPPED", "KNOWN")
          COLUMNS = ("Test", "Kind", "Guards", "Checks", "Runs", "Last result", "Seen failing")
          OTHER = "Other"


          def tsv(root, name):
              path = os.path.join(root, ".loop", name)
              if not os.path.exists(path):
                  return []
              with open(path) as handle:
                  return [line.rstrip("\n").split("\t") for line in handle if line.strip() and not line.startswith("#")]


          def cell(text, raw=False):
              """One table cell: whitespace runs (newlines too) collapsed, and | escaped so it can't split a column (kept for --tsv)."""
              text = " ".join(str(text).split()) or "-"
              return text if raw else text.replace("|", "\\|")


          def features(root):
              """(page titles in page order, {requirement id: (title, words)}); an id on two pages stays with the first."""
              try:
                  with open(os.path.join(root, ".loop", "config.json")) as handle:
                      folder = json.load(handle).get("wiki_dir") or "docs/wiki"
              except (OSError, ValueError):
                  folder = "docs/wiki"
              titles, found = [], {}
              for name in sorted(glob.glob(os.path.join(root, folder, "*.md"))):
                  with open(name) as handle:
                      text = re.sub(r"(?ms)^```.*?^```[^\n]*$", "", handle.read())
                  head = re.search(r"^# (.+)$", text, re.M)
                  title = head.group(1).strip() if head else os.path.basename(name)[:-3]
                  part = re.split(r"\n## (?:Requirements|Criteria)[ \t]*\n", text, maxsplit=1)
                  if len(part) < 2:
                      continue
                  titles.append(title)
                  for key, words in re.findall(r"^- ([A-Z]{2,5}-\d+): (.*)$", part[1].split("\n## ", 1)[0], re.M):
                      words = re.sub(r"<!--.*?-->", "", re.sub(r"^\*\*(?:Reviewed|Unreviewed)[^*]*\*\*\s*", "", words)).strip()
                      found.setdefault(key, (title, words))
              return titles, found


          def key_of(row):
              """The requirement a row guards: its goal, or its own id, when either is an ID; '-' guards none."""
              return "" if row[3] == "-" else next((item for item in (row[3], row[0]) if ID.match(item)), "")


          def issues_of(root):
              """{link: (state, date, reopened_at)}; reopened_at is the newest reopen time GitHub's timeline gave, or empty."""
              return {row[0]: (row[1], row[2] if len(row) > 2 else "", row[3] if len(row) > 3 else "")
                      for row in tsv(root, "regression-issues.tsv") if len(row) > 1}


          def guard(row, found, issues, markdown):
              """What a test guards: the issue link and its recorded state for a defect, else the requirement's ID and words."""
              link = row[7]
              if row[6] == "defect" and link:
                  number = re.search(r"/(issues|pull)/(\d+)$", link)
                  if not number:
                      return link.replace("finding:", "finding ", 1)
                  state, day = issues.get(link, ("state unknown", ""))[:2]
                  name = ("#" if number.group(1) == "issues" else "PR ") + number.group(2)
                  shown = "[%s](%s)" % (name, link) if markdown else "%s %s" % (name, link)
                  return "%s %s%s" % (shown, state.lower(), " (%s)" % day if day else "")
              key = key_of(row)
              if key:
                  return "%s: %s" % (key, found[key][1]) if key in found else key
              return "done line " + row[3] if re.match(r"^[\w-]+:\d+$", row[3]) else "-"


          def fields(row, found, ran, issues, markdown=False, raw=False):
              """The one fixed format for one row (all 8 columns of regression.tsv): test, kind, guards, checks, runs, last
              result and date, seen failing."""
              status, day, flag = (tuple(ran.get(row[0], ("not run", ""))) + ("",))[:3]  # a caller's (status, date) has no flag
              known = issues.get(row[7], ()) if row[6] == "defect" else ()
              if len(known) > 2 and known[2] and known[0] == "open" and not (status == "PASS" and day > known[2][:10]):
                  status, day = "failing (issue reopened)", known[2][:10]  # REG-6: until the issue closes or a later day passes
              return [cell(item, raw) for item in (row[0], KIND.get(row[6] or "criterion", row[6]), guard(row, found, issues, markdown),
                                              row[5] or "-", RUNS.get(row[1], row[1] or "-"), (status + " " + day).strip() + flag,
                                              row[4] if SEEN.match(row[4]) else "no")]


          def entries(root, results=None, markdown=False, raw=False):
              """[(feature, [fields])] in page order, then Other; rows in file order, draft rows left out. With results, only
              the rows that run reported, each with that run's state."""
              titles, found = features(root)
              ran = {row[0]: ((row + [""] * 5)[1:3] + [" FLAKY" if (row + [""] * 5)[4] else ""]) for row in tsv(root, "regression-runs.tsv")
                     if len(row) > 1}  # REG-9: a 5th cell (the commit a result flipped on) adds FLAKY after the raw result
              if results is not None:
                  ran = {name: (state, "", "") for name, state in results.items()}
              issues, groups = issues_of(root), {}
              rows = {row[0]: (row + [""] * 8)[:8] for row in tsv(root, "regression.tsv")}
              order = [name for name in rows if rows[name][1] != "draft"] if results is None else list(results)
              for name in order:
                  row = rows.get(name) or [name, "", "", "-", "", "", "-", ""]
                  key = key_of(row)
                  groups.setdefault(found[key][0] if key in found else OTHER, []).append(fields(row, found, ran, issues, markdown, raw))
              return [(title, groups[title]) for title in titles + [OTHER] if title in groups]


          def table(header, lines):
              return ["| " + " | ".join(header) + " |", "|" + "---|" * len(header)] + ["| " + " | ".join(x) + " |" for x in lines]


          def cmd_list(args):
              out = []
              for feature, lines in entries(args.root, markdown=args.markdown, raw=args.tsv):
                  lines = [each for each in lines if each[1] == (args.kind or each[1])]
                  if not lines:
                      continue
                  if args.tsv:
                      out += ["\t".join([feature] + each) for each in lines]
                  elif args.markdown:
                      out += ["### " + feature, ""] + table(COLUMNS, lines) + [""]
                  else:
                      out += ["FEATURE " + feature] + [" | ".join(each[:6]) + " | seen failing " + each[6] for each in lines]
              print("\n".join(out).rstrip("\n") if out else "NO TESTS")
              return 0


          def refuse(text):
              sys.stderr.write("REFUSED: %s\n" % text)
              return 2


          def cmd_summary(args):
              try:
                  took = float(args.took)
                  if took < 0 or not math.isfinite(took):
                      raise ValueError
              except ValueError:
                  return refuse("--took %r is not a number of seconds. Fix: pass the run's seconds, e.g. --took 95" % args.took)
              try:
                  with open(args.results) as handle:
                      raw = handle.read().splitlines()
              except OSError as err:
                  return refuse("can't read the results file %s: %s. Fix: pass the file the run wrote" % (args.results, err.strerror))
              results = {}
              for number, line in enumerate(raw, 1):
                  if not line.strip() or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) != 2 or parts[1] not in STATES:
                      return refuse("%s:%d is %r, not id<TAB>state with a state in %s. Fix: correct that line"
                                    % (args.results, number, line[:80], ", ".join(STATES)))
                  results[parts[0]] = parts[1]
              count = {state: sum(1 for value in results.values() if value == state) for state in STATES}
              minutes, seconds = divmod(int(round(took)), 60)
              out = ["## Regression: %d passed, %d failed, %d known, %d skipped of %d, in %dm %02ds"
                     % (count["PASS"], count["FAIL"], count["KNOWN"], count["SKIPPED"], len(results), minutes, seconds), ""]
              for feature, lines in entries(args.root, results, markdown=True):
                  out += ["### " + feature, ""] + table(("Test", "Kind", "Guards", "Checks", "Result"),
                                                        [x[:4] + [x[5]] for x in lines]) + [""]
              print("\n".join(out).rstrip("\n"))
              return 0


          def gh(*args):
              try:
                  return subprocess.run(("gh",) + args, capture_output=True, text=True, timeout=60)
              except (OSError, subprocess.SubprocessError) as err:
                  return subprocess.CompletedProcess(args, 1, "", str(err))


          def reopened(link):
              """The newest time the issue's GitHub timeline says it was reopened, or "" (REG-6: sampled states miss a reopen)."""
              parts = re.match(r"^https?://[^/]+/([^/]+)/([^/]+)/issues/(\d+)$", link)
              if not parts:
                  return ""
              done = gh("api", "--paginate", "repos/%s/%s/issues/%s/events" % parts.groups(), "--jq",
                        '.[] | select(.event == "reopened") | .created_at')  # every page: a busy issue's reopen is past the first
              value = (done.stdout.split() or [""])[-1]
              return value if done.returncode == 0 and re.match(r"^\d{4}-\d\d-\d\dT", value) else ""


          def cmd_issues(args):
              probe = gh("auth", "status")
              if probe.returncode:
                  cause = (probe.stderr or probe.stdout).strip().splitlines()
                  sys.stderr.write("ISSUES: cannot read issues (gh: %s). Fix: gh auth login, or set GH_TOKEN\n"
                                   % (cause[0][:120] if cause else "not available"))
                  return 1
              old, day, out, rows = issues_of(args.root), datetime.date.today().isoformat(), {}, tsv(args.root, "regression.tsv")
              for row in rows:
                  link = row[7] if len(row) > 7 else ""
                  kind = re.match(r"^https?://\S+/(issues|pull)/\d+$", link)
                  if row[6:7] != ["defect"] or not kind or link in out:
                      continue
                  done = gh("issue" if kind.group(1) == "issues" else "pr", "view", link, "--json", "state", "-q", ".state")
                  state = done.stdout.strip().lower()
                  kept = (old.get(link, ()) + ("unknown", day, ""))[:3] if link in old else ("unknown", day, "")
                  new = kept if done.returncode or not state or state == kept[0] else (state, day, kept[2])
                  out[link] = new[:2] + (reopened(link) or new[2],) if kind.group(1) == "issues" and state == "open" else new
                  print("ISSUE %s %s" % (link, out[link][0]))
              if args.write and rows:  # no rows read: keep the recorded states rather than wipe them
                  path = os.path.join(args.root, ".loop", "regression-issues.tsv")
                  fd, new = tempfile.mkstemp(dir=os.path.dirname(path), prefix=".regression-issues.")  # its own name per writer
                  with os.fdopen(fd, "w") as handle:
                      handle.write("# link\tstate\tdate\treopened_at\n" + "".join("%s\t%s\t%s\t%s\n" % (k, *v) for k, v in sorted(out.items())))
                  os.replace(new, path)  # whole or not at all
              return 0


          def cmd_fixes(args):
              """The release notes' proof lines (REG-6): defect rows this range added or proved, linked to an issue, passing now."""
              shown = subprocess.run(["git", "show", "%s:.loop/regression.tsv" % args.since], cwd=args.root, capture_output=True,
                                     text=True, env=dict(os.environ, LC_ALL="C"))  # git's English messages, matched below
              if shown.returncode and "exists on disk, but not in" not in shown.stderr and "does not exist" not in shown.stderr:
                  return refuse("cannot read .loop/regression.tsv at %s: %s" % (args.since, shown.stderr.strip()[:200]))
              old = {cells[0]: cells for cells in (line.split("\t") for line in shown.stdout.splitlines()) if cells[0] and cells[0][0] != "#"}
              ran = {row[0]: row[1:2] for row in tsv(args.root, "regression-runs.tsv")}
              origin = subprocess.run(["git", "remote", "get-url", "origin"], cwd=args.root, capture_output=True, text=True).stdout
              repo = re.search(r"github\.com[:/]([^/\s]+/[^/\s]+?)(?:\.git)?\s*$", origin)  # only this repo's issues are its fixes
              for row in tsv(args.root, "regression.tsv"):
                  row = (row + [""] * 8)[:8]
                  found = re.match(r"^https?://\S+/issues/(\d+)$", row[7])
                  found = found if not repo or re.match(r"^https?://github\.com/%s/issues/" % re.escape(repo.group(1)), row[7], re.I) else None  # no GitHub origin: nothing to compare
                  before = (old.get(row[0], []) + [""] * 8)[4]
                  if row[6] == "defect" and found and SEEN.match(row[4]) and row[4] != before and ran.get(row[0]) == ["PASS"]:
                      print("Fixes #%s: test %s, seen failing %s, passing" % (found.group(1), row[0], row[4]))
              return 0


          def main():
              parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              sub = parser.add_subparsers(dest="command", required=True)
              item = sub.add_parser("list")
              shape = item.add_mutually_exclusive_group()
              shape.add_argument("--markdown", action="store_true")
              shape.add_argument("--tsv", action="store_true")
              item.add_argument("--kind", choices=tuple(KIND.values()))
              item.set_defaults(func=cmd_list)
              item = sub.add_parser("summary")
              item.add_argument("--results", required=True)
              item.add_argument("--took", required=True)
              item.set_defaults(func=cmd_summary)
              item = sub.add_parser("fixes")
              item.add_argument("--since", required=True)
              item.set_defaults(func=cmd_fixes)
              item = sub.add_parser("issues")
              item.add_argument("--write", action="store_true")
              item.set_defaults(func=cmd_issues)
              for each in sub.choices.values():
                  each.add_argument("--root", default="")
              args = parser.parse_args()
              if not args.root:
                  top = subprocess.run(["git", "rev-parse", "--show-toplevel"], capture_output=True, text=True)
                  args.root = top.stdout.strip() or os.getcwd()
              return args.func(args)


          if __name__ == "__main__":
              sys.exit(main())
          TESTS_PY_EOF
          python3 -I "$here/tests.py" list --tsv > "$here/map.tsv" 2>/dev/null || true
          export REGRESSION_MAP="$here/map.tsv"
          python3 - <<'PY'
          import json, os, re, subprocess, sys, tempfile, time, urllib.parse
          def rows(path):
              if not os.path.exists(path):
                  return []
              return [line.rstrip("\n").split("\t") for line in open(path) if line.strip() and not line.startswith("#")]
          known = {row[0] for row in rows(".loop/regression-known.tsv")}
          TARGET = os.environ.get("REGRESSION_TARGET") or os.environ.get("REGRESSION_LEVELS") or "nightly"
          if not re.fullmatch(r"land|nightly|[A-Za-z0-9_.-]+", TARGET) or TARGET not in ("land", "nightly") and \
                  TARGET not in [row[0] for row in rows(".loop/regression.tsv")]:
              print("REFUSED (BAD_TARGET): bad target %s: use land, nightly or a row id from regression.py list. Fix: rerun the "
                    "workflow with one of those" % json.dumps(TARGET), file=sys.stderr)
              sys.exit(1)
          def wanted(row):  # a row id runs that row alone; land runs land rows; nightly runs land and nightly rows
              return row[0] == TARGET if TARGET not in ("land", "nightly") else row[1] in ("land", TARGET)
          def gh(*args, body=None):  # a long text goes in a file as --body-file, never on the command line (Windows caps it)
              if body is not None:
                  with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False, encoding="utf-8", newline="\n") as f:
                      f.write(body)
                  args += ("--body-file", f.name)
              try:
                  return subprocess.run(("gh",) + args, capture_output=True, text=True)
              finally:
                  if body is not None:
                      os.remove(f.name)
          def seconds(name, default):  # a bad or non-positive value falls back to the default
              try:
                  value = int(os.environ.get(name) or default)
              except ValueError:
                  return default
              return value if value > 0 else default
          ROW_SECONDS, JOB_SECONDS = seconds("REGRESSION_ROW_SECONDS", 900), seconds("REGRESSION_JOB_SECONDS", 88 * 60)
          ROW_ENV = {k: v for k, v in os.environ.items() if k not in ('GH_TOKEN', 'GITHUB_TOKEN', 'GITHUB_STEP_SUMMARY', 'GITHUB_ENV', 'GITHUB_OUTPUT', 'GITHUB_PATH', 'GITHUB_STATE', 'REGRESSION_RESULTS', 'REGRESSION_MAP', 'RUNNER_TEMP', 'SUITE_TIME_FILE')}  # no token, no runner file a row could write into
          def run(command):  # own process group, output to a file: a row that times out fails alone and keeps what it printed
              with tempfile.TemporaryFile("w+", errors="replace") as log:
                  child = subprocess.Popen(command, shell=True, stdout=log, stderr=subprocess.STDOUT, env=ROW_ENV,
                                           start_new_session=True)
                  timed_out = False
                  try:
                      child.wait(timeout=ROW_SECONDS)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                  try:
                      os.killpg(child.pid, 9)
                  except OSError:
                      pass
                  except AttributeError:  # Windows: no process groups, taskkill takes the tree
                      subprocess.run(["taskkill", "/T", "/F", "/PID", str(child.pid)], capture_output=True)
                  child.wait()
                  log.seek(0)
                  out = log.read()
              if timed_out:
                  return 124, out + "\ntimed out after %d s" % ROW_SECONDS
              return child.returncode, out
          def result(name, state):  # written as each row ends, so a job that runs out of time keeps what finished
              with open(os.environ.get("REGRESSION_RESULTS") or os.devnull, "a") as handle:
                  handle.write("%s\t%s\n" % (name, state))
          gh("label", "create", "regression", "--force", "--description", "A regression row is failing")
          gh("label", "create", "defect", "--description", "A test that guards it is failing")  # an existing one keeps its colour
          guards = {cells[1]: cells for cells in rows(os.environ.get("REGRESSION_MAP") or os.devnull) if len(cells) > 4}
          out = gh("issue", "list", "--label", "regression", "--state", "all", "--limit", "200", "--json", "number,state,body,labels")
          issues = json.loads(out.stdout or "[]") if out.returncode == 0 else None  # unread: change no issue, or each would repeat
          if issues is None:
              print("NOTE: can't read issues, so none changed: " + out.stderr.strip()[:200])
          FEATURES = {row[0] for row in rows(".loop/docs.tsv") if row and row[0] and row[0] != "Home"}  # the pages
          try:  # the feature_labels setting (default off): only when true is a feature label made or set
              LABELS_ON = json.load(open(".loop/config.json")).get("feature_labels") is True
          except (OSError, ValueError, AttributeError):
              LABELS_ON = False
          failed, filed = [], [0]
          def write(what, *args, body=None):  # every issue write is checked: a failure is named, and the step fails after the last row
              done = gh(*args, body=body)
              if done.returncode:
                  failed.append(what)
                  print("FAILED %s: %s (FILE_FAILED)" % (what, done.stderr.strip()[:160]))
              else:
                  filed[0] += 1
              return done
          def label_for(page):  # the page's feature label, made first; "" when off, for no page, or if it can't be made
              if not LABELS_ON or page not in FEATURES:
                  return ""
              label = "feature:" + "".join(c for c in page if c != "," and c.isprintable())[:42]  # issues.feature_label
              made = gh("label", "create", label, "--force", "--description", "Issues about one feature")
              if made.returncode:
                  print("FAILED label %s: %s" % (label, made.stderr.strip()[:160]))
                  return ""
              return label
          FOUND = re.compile(r"<!-- loop-regression (\S+?)(?: placed=(\S*))? -->")  # placed= is written empty; older ones still parse
          def marked(body):
              match = FOUND.search(body or "")
              return (match.group(1), urllib.parse.unquote(match.group(2) or "")) if match else (None, "")
          red, start = [], time.time()
          with open(os.environ.get("REGRESSION_RESULTS") or os.devnull, "w") as handle:
              handle.write("# started %d\n" % start)
          for row in rows(".loop/regression.tsv"):
              if len(row) < 3 or not wanted(row):
                  continue
              if time.time() - start + ROW_SECONDS > JOB_SECONDS:  # a row may run its full limit, so it must still fit
                  code, said, skipped = 125, "skipped: out of job time; this row did not run", True
              else:
                  (code, said), skipped = run(row[2]), False
              hits = [item for item in issues or [] if marked(item["body"])[0] == row[0]]
              hit = next((item for item in hits if item["state"] == "OPEN"), hits[0] if hits else None)
              state = "PASS" if code == 0 else "SKIPPED" if skipped or code == 77 else "KNOWN" if row[0] in known else "FAIL"
              print(state, row[0])
              result(row[0], state)
              if code == 0:
                  for item in hits:
                      if item["state"] == "OPEN":
                          gh("issue", "close", str(item["number"]), "--comment", "Passing again.")
              elif row[0] not in known and code != 77:  # 77: the row says it cannot run here (SKIPPED), not a failure
                  red.append(row[0])
                  if issues is None:
                      continue
                  cells = guards.get(row[0]) or [""] * 5
                  label = label_for(cells[0])
                  mark = "<!-- loop-regression %s placed= -->" % row[0]
                  about = "- Feature: %s\n- Guards: %s\n- Checks: %s\n\n" % (cells[0] or "-", cells[3] or "-", cells[4] or "-")
                  body = "%s\nThe row `%s` %s.\n\n%s```\n%s\n```\n" % (mark, row[0], "was skipped" if skipped else "fails", about,
                                                                 said[-1500:].replace("`" * 3, "'" * 3))
                  if not hit:
                      make = ["issue", "create", "--title", "Regression: " + row[0], "--label", "regression", "--label", "defect"]
                      made = gh(*make, *(["--label", label] if label else []), body=body)
                      if made.returncode and label and "label" in made.stderr.lower():  # a refused label never loses the report
                          print("FAILED label %s: %s" % (label, made.stderr.strip()[:160]))
                          made = gh(*make, body=body)
                      if made.returncode:
                          failed.append("issue for " + row[0])
                          print("FAILED issue for %s: %s (FILE_FAILED)" % (row[0], made.stderr.strip()[:160]))
                      else:
                          filed[0] += 1
                  else:
                      n = str(hit["number"])
                      names = [label.get("name") for label in hit.get("labels") or []]
                      if hit["state"] != "OPEN":
                          write("reopen #" + n, "issue", "reopen", n)
                      if "defect" not in names:
                          write("label #" + n, "issue", "edit", n, "--add-label", "defect")
                      if label and label not in names:
                          write("feature label #" + n, "issue", "edit", n, "--add-label", label)
                      write("comment #" + n, "issue", "comment", n, body="Skipped: out of job time; not run." if skipped else "Still failing.")
          if TARGET == "nightly":  # the full suite's time (a cut-short run's too: at least that long) for health's REG-7 check
              took, sha = int(time.time() - start), subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
              with open(os.environ.get("SUITE_TIME_FILE") or os.devnull, "w") as handle:
                  handle.write("%s\tfull\t%d\t%s\n" % (sha, took, time.strftime("%Y-%m-%d", time.gmtime())))
              print("SUITE_TIME %d" % took)
          if failed:
              print("FILED %d issue writes; FAILED %d: %s (FILE_FAILED)" % (filed[0], len(failed), ", ".join(failed)))
          sys.exit(1 if red or failed else 0)
          PY
      - name: Keep the full suite's time for the health job
        if: always() && steps.routine.outputs.on == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-time
          path: ${{ runner.temp }}/suite-time.tsv
          if-no-files-found: ignore
          retention-days: 30
      - name: Write the run summary, one table per feature
        if: always() && steps.routine.outputs.on == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_RESULTS: ${{ runner.temp }}/regression-results.tsv
        run: |
          here=$(mktemp -d)  # a new private folder: nothing a row left behind is on this script's import path
          cat > "$here/tests.py" <<'TESTS_PY_EOF'
          #!/usr/bin/env python3
          """List every regression test in one fixed format, grouped by feature.

          usage: tests.py <command> [--root DIR]

            list [--markdown|--tsv] [--kind K]  every test from the recorded runs, one group per feature; --kind requirement,
                                              workflow or defect lists only that kind
            summary --results FILE --took S   a GitHub run summary: one header with totals and the run time, then one table per
                                              feature, from that run's results file (id<TAB>state lines; # lines are skipped)
            issues [--write]                  read each defect test's issue or pull request state with gh; --write records them in
                                              .loop/regression-issues.tsv (link, state, date, reopened_at) for the wiki and the
                                              health report; a defect row whose open issue was reopened shows "failing (issue
                                              reopened)" until the issue closes or a run on a later day passes
            fixes --since REF                 one "Fixes #N: test ROW, seen failing DATE, passing" line per issue fixed since REF: a
                                              defect row added, or whose seen-failing date was set, since REF, that links the
                                              issue and passes in .loop/regression-runs.tsv (REG-6); the release notes list them

          A feature is the wiki page that holds the requirement a row guards (its goal, or its id); a row that guards none is in
          Other. Each test shows: test, kind (requirement, workflow or defect), what it guards (the requirement's ID and words, or the
          issue's link and state), what it checks, when it runs, its last result and date (then FLAKY when that result flipped on
          one clean commit, REG-9), and when it was seen failing.
          Stdlib only and self-contained: the regression workflow carries a copy of this file.
          """
          import argparse
          import datetime
          import glob
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import tempfile

          # No terminal, no waiting: a prompt from git or gh must fail, not block.
          os.environ.update(GIT_TERMINAL_PROMPT="0", GH_PROMPT_DISABLED="1", GIT_EDITOR="true", GIT_ASKPASS="true", SSH_ASKPASS="true")
          if not sys.stdin or not sys.stdin.isatty():
              os.dup2(os.open(os.devnull, os.O_RDONLY), 0)

          ID = re.compile(r"^[A-Z]{2,5}-\d+$")
          SEEN = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          KIND = {"criterion": "requirement", "workflow": "workflow", "defect": "defect"}  # category: kind
          RUNS = {"land": "both", "nightly": "nightly", "covered": "by a person"}
          STATES = ("PASS", "FAIL", "SKIPPED", "KNOWN")
          COLUMNS = ("Test", "Kind", "Guards", "Checks", "Runs", "Last result", "Seen failing")
          OTHER = "Other"


          def tsv(root, name):
              path = os.path.join(root, ".loop", name)
              if not os.path.exists(path):
                  return []
              with open(path) as handle:
                  return [line.rstrip("\n").split("\t") for line in handle if line.strip() and not line.startswith("#")]


          def cell(text, raw=False):
              """One table cell: whitespace runs (newlines too) collapsed, and | escaped so it can't split a column (kept for --tsv)."""
              text = " ".join(str(text).split()) or "-"
              return text if raw else text.replace("|", "\\|")


          def features(root):
              """(page titles in page order, {requirement id: (title, words)}); an id on two pages stays with the first."""
              try:
                  with open(os.path.join(root, ".loop", "config.json")) as handle:
                      folder = json.load(handle).get("wiki_dir") or "docs/wiki"
              except (OSError, ValueError):
                  folder = "docs/wiki"
              titles, found = [], {}
              for name in sorted(glob.glob(os.path.join(root, folder, "*.md"))):
                  with open(name) as handle:
                      text = re.sub(r"(?ms)^```.*?^```[^\n]*$", "", handle.read())
                  head = re.search(r"^# (.+)$", text, re.M)
                  title = head.group(1).strip() if head else os.path.basename(name)[:-3]
                  part = re.split(r"\n## (?:Requirements|Criteria)[ \t]*\n", text, maxsplit=1)
                  if len(part) < 2:
                      continue
                  titles.append(title)
                  for key, words in re.findall(r"^- ([A-Z]{2,5}-\d+): (.*)$", part[1].split("\n## ", 1)[0], re.M):
                      words = re.sub(r"<!--.*?-->", "", re.sub(r"^\*\*(?:Reviewed|Unreviewed)[^*]*\*\*\s*", "", words)).strip()
                      found.setdefault(key, (title, words))
              return titles, found


          def key_of(row):
              """The requirement a row guards: its goal, or its own id, when either is an ID; '-' guards none."""
              return "" if row[3] == "-" else next((item for item in (row[3], row[0]) if ID.match(item)), "")


          def issues_of(root):
              """{link: (state, date, reopened_at)}; reopened_at is the newest reopen time GitHub's timeline gave, or empty."""
              return {row[0]: (row[1], row[2] if len(row) > 2 else "", row[3] if len(row) > 3 else "")
                      for row in tsv(root, "regression-issues.tsv") if len(row) > 1}


          def guard(row, found, issues, markdown):
              """What a test guards: the issue link and its recorded state for a defect, else the requirement's ID and words."""
              link = row[7]
              if row[6] == "defect" and link:
                  number = re.search(r"/(issues|pull)/(\d+)$", link)
                  if not number:
                      return link.replace("finding:", "finding ", 1)
                  state, day = issues.get(link, ("state unknown", ""))[:2]
                  name = ("#" if number.group(1) == "issues" else "PR ") + number.group(2)
                  shown = "[%s](%s)" % (name, link) if markdown else "%s %s" % (name, link)
                  return "%s %s%s" % (shown, state.lower(), " (%s)" % day if day else "")
              key = key_of(row)
              if key:
                  return "%s: %s" % (key, found[key][1]) if key in found else key
              return "done line " + row[3] if re.match(r"^[\w-]+:\d+$", row[3]) else "-"


          def fields(row, found, ran, issues, markdown=False, raw=False):
              """The one fixed format for one row (all 8 columns of regression.tsv): test, kind, guards, checks, runs, last
              result and date, seen failing."""
              status, day, flag = (tuple(ran.get(row[0], ("not run", ""))) + ("",))[:3]  # a caller's (status, date) has no flag
              known = issues.get(row[7], ()) if row[6] == "defect" else ()
              if len(known) > 2 and known[2] and known[0] == "open" and not (status == "PASS" and day > known[2][:10]):
                  status, day = "failing (issue reopened)", known[2][:10]  # REG-6: until the issue closes or a later day passes
              return [cell(item, raw) for item in (row[0], KIND.get(row[6] or "criterion", row[6]), guard(row, found, issues, markdown),
                                              row[5] or "-", RUNS.get(row[1], row[1] or "-"), (status + " " + day).strip() + flag,
                                              row[4] if SEEN.match(row[4]) else "no")]


          def entries(root, results=None, markdown=False, raw=False):
              """[(feature, [fields])] in page order, then Other; rows in file order, draft rows left out. With results, only
              the rows that run reported, each with that run's state."""
              titles, found = features(root)
              ran = {row[0]: ((row + [""] * 5)[1:3] + [" FLAKY" if (row + [""] * 5)[4] else ""]) for row in tsv(root, "regression-runs.tsv")
                     if len(row) > 1}  # REG-9: a 5th cell (the commit a result flipped on) adds FLAKY after the raw result
              if results is not None:
                  ran = {name: (state, "", "") for name, state in results.items()}
              issues, groups = issues_of(root), {}
              rows = {row[0]: (row + [""] * 8)[:8] for row in tsv(root, "regression.tsv")}
              order = [name for name in rows if rows[name][1] != "draft"] if results is None else list(results)
              for name in order:
                  row = rows.get(name) or [name, "", "", "-", "", "", "-", ""]
                  key = key_of(row)
                  groups.setdefault(found[key][0] if key in found else OTHER, []).append(fields(row, found, ran, issues, markdown, raw))
              return [(title, groups[title]) for title in titles + [OTHER] if title in groups]


          def table(header, lines):
              return ["| " + " | ".join(header) + " |", "|" + "---|" * len(header)] + ["| " + " | ".join(x) + " |" for x in lines]


          def cmd_list(args):
              out = []
              for feature, lines in entries(args.root, markdown=args.markdown, raw=args.tsv):
                  lines = [each for each in lines if each[1] == (args.kind or each[1])]
                  if not lines:
                      continue
                  if args.tsv:
                      out += ["\t".join([feature] + each) for each in lines]
                  elif args.markdown:
                      out += ["### " + feature, ""] + table(COLUMNS, lines) + [""]
                  else:
                      out += ["FEATURE " + feature] + [" | ".join(each[:6]) + " | seen failing " + each[6] for each in lines]
              print("\n".join(out).rstrip("\n") if out else "NO TESTS")
              return 0


          def refuse(text):
              sys.stderr.write("REFUSED: %s\n" % text)
              return 2


          def cmd_summary(args):
              try:
                  took = float(args.took)
                  if took < 0 or not math.isfinite(took):
                      raise ValueError
              except ValueError:
                  return refuse("--took %r is not a number of seconds. Fix: pass the run's seconds, e.g. --took 95" % args.took)
              try:
                  with open(args.results) as handle:
                      raw = handle.read().splitlines()
              except OSError as err:
                  return refuse("can't read the results file %s: %s. Fix: pass the file the run wrote" % (args.results, err.strerror))
              results = {}
              for number, line in enumerate(raw, 1):
                  if not line.strip() or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) != 2 or parts[1] not in STATES:
                      return refuse("%s:%d is %r, not id<TAB>state with a state in %s. Fix: correct that line"
                                    % (args.results, number, line[:80], ", ".join(STATES)))
                  results[parts[0]] = parts[1]
              count = {state: sum(1 for value in results.values() if value == state) for state in STATES}
              minutes, seconds = divmod(int(round(took)), 60)
              out = ["## Regression: %d passed, %d failed, %d known, %d skipped of %d, in %dm %02ds"
                     % (count["PASS"], count["FAIL"], count["KNOWN"], count["SKIPPED"], len(results), minutes, seconds), ""]
              for feature, lines in entries(args.root, results, markdown=True):
                  out += ["### " + feature, ""] + table(("Test", "Kind", "Guards", "Checks", "Result"),
                                                        [x[:4] + [x[5]] for x in lines]) + [""]
              print("\n".join(out).rstrip("\n"))
              return 0


          def gh(*args):
              try:
                  return subprocess.run(("gh",) + args, capture_output=True, text=True, timeout=60)
              except (OSError, subprocess.SubprocessError) as err:
                  return subprocess.CompletedProcess(args, 1, "", str(err))


          def reopened(link):
              """The newest time the issue's GitHub timeline says it was reopened, or "" (REG-6: sampled states miss a reopen)."""
              parts = re.match(r"^https?://[^/]+/([^/]+)/([^/]+)/issues/(\d+)$", link)
              if not parts:
                  return ""
              done = gh("api", "--paginate", "repos/%s/%s/issues/%s/events" % parts.groups(), "--jq",
                        '.[] | select(.event == "reopened") | .created_at')  # every page: a busy issue's reopen is past the first
              value = (done.stdout.split() or [""])[-1]
              return value if done.returncode == 0 and re.match(r"^\d{4}-\d\d-\d\dT", value) else ""


          def cmd_issues(args):
              probe = gh("auth", "status")
              if probe.returncode:
                  cause = (probe.stderr or probe.stdout).strip().splitlines()
                  sys.stderr.write("ISSUES: cannot read issues (gh: %s). Fix: gh auth login, or set GH_TOKEN\n"
                                   % (cause[0][:120] if cause else "not available"))
                  return 1
              old, day, out, rows = issues_of(args.root), datetime.date.today().isoformat(), {}, tsv(args.root, "regression.tsv")
              for row in rows:
                  link = row[7] if len(row) > 7 else ""
                  kind = re.match(r"^https?://\S+/(issues|pull)/\d+$", link)
                  if row[6:7] != ["defect"] or not kind or link in out:
                      continue
                  done = gh("issue" if kind.group(1) == "issues" else "pr", "view", link, "--json", "state", "-q", ".state")
                  state = done.stdout.strip().lower()
                  kept = (old.get(link, ()) + ("unknown", day, ""))[:3] if link in old else ("unknown", day, "")
                  new = kept if done.returncode or not state or state == kept[0] else (state, day, kept[2])
                  out[link] = new[:2] + (reopened(link) or new[2],) if kind.group(1) == "issues" and state == "open" else new
                  print("ISSUE %s %s" % (link, out[link][0]))
              if args.write and rows:  # no rows read: keep the recorded states rather than wipe them
                  path = os.path.join(args.root, ".loop", "regression-issues.tsv")
                  fd, new = tempfile.mkstemp(dir=os.path.dirname(path), prefix=".regression-issues.")  # its own name per writer
                  with os.fdopen(fd, "w") as handle:
                      handle.write("# link\tstate\tdate\treopened_at\n" + "".join("%s\t%s\t%s\t%s\n" % (k, *v) for k, v in sorted(out.items())))
                  os.replace(new, path)  # whole or not at all
              return 0


          def cmd_fixes(args):
              """The release notes' proof lines (REG-6): defect rows this range added or proved, linked to an issue, passing now."""
              shown = subprocess.run(["git", "show", "%s:.loop/regression.tsv" % args.since], cwd=args.root, capture_output=True,
                                     text=True, env=dict(os.environ, LC_ALL="C"))  # git's English messages, matched below
              if shown.returncode and "exists on disk, but not in" not in shown.stderr and "does not exist" not in shown.stderr:
                  return refuse("cannot read .loop/regression.tsv at %s: %s" % (args.since, shown.stderr.strip()[:200]))
              old = {cells[0]: cells for cells in (line.split("\t") for line in shown.stdout.splitlines()) if cells[0] and cells[0][0] != "#"}
              ran = {row[0]: row[1:2] for row in tsv(args.root, "regression-runs.tsv")}
              origin = subprocess.run(["git", "remote", "get-url", "origin"], cwd=args.root, capture_output=True, text=True).stdout
              repo = re.search(r"github\.com[:/]([^/\s]+/[^/\s]+?)(?:\.git)?\s*$", origin)  # only this repo's issues are its fixes
              for row in tsv(args.root, "regression.tsv"):
                  row = (row + [""] * 8)[:8]
                  found = re.match(r"^https?://\S+/issues/(\d+)$", row[7])
                  found = found if not repo or re.match(r"^https?://github\.com/%s/issues/" % re.escape(repo.group(1)), row[7], re.I) else None  # no GitHub origin: nothing to compare
                  before = (old.get(row[0], []) + [""] * 8)[4]
                  if row[6] == "defect" and found and SEEN.match(row[4]) and row[4] != before and ran.get(row[0]) == ["PASS"]:
                      print("Fixes #%s: test %s, seen failing %s, passing" % (found.group(1), row[0], row[4]))
              return 0


          def main():
              parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              sub = parser.add_subparsers(dest="command", required=True)
              item = sub.add_parser("list")
              shape = item.add_mutually_exclusive_group()
              shape.add_argument("--markdown", action="store_true")
              shape.add_argument("--tsv", action="store_true")
              item.add_argument("--kind", choices=tuple(KIND.values()))
              item.set_defaults(func=cmd_list)
              item = sub.add_parser("summary")
              item.add_argument("--results", required=True)
              item.add_argument("--took", required=True)
              item.set_defaults(func=cmd_summary)
              item = sub.add_parser("fixes")
              item.add_argument("--since", required=True)
              item.set_defaults(func=cmd_fixes)
              item = sub.add_parser("issues")
              item.add_argument("--write", action="store_true")
              item.set_defaults(func=cmd_issues)
              for each in sub.choices.values():
                  each.add_argument("--root", default="")
              args = parser.parse_args()
              if not args.root:
                  top = subprocess.run(["git", "rev-parse", "--show-toplevel"], capture_output=True, text=True)
                  args.root = top.stdout.strip() or os.getcwd()
              return args.func(args)


          if __name__ == "__main__":
              sys.exit(main())
          TESTS_PY_EOF
          started=$(sed -n 's/^# started //p' "$REGRESSION_RESULTS" 2>/dev/null | head -n 1 || true)
          case "$started" in ''|*[!0-9]*) started=$(date +%s) ;; esac  # a number, or now: never an expression
          left=$(( started + 89 * 60 - $(date +%s) - 30 ))  # the rows end by minute 88; keep 30 s for the summary itself
          [ "$left" -ge 10 ] && timeout "$(( left < 60 ? left : 60 ))" python3 -I "$here/tests.py" issues --write >/dev/null || true
          took=$(( $(date +%s) - started ))
          GH_TOKEN= python3 -I "$here/tests.py" summary --results "$REGRESSION_RESULTS" --took "$took" >> "$GITHUB_STEP_SUMMARY" || {
            printf '## Regression\n\nThe grouped summary could not be written; see this step'"'"'s log.\n\n| Test | Result |\n|---|---|\n'
            grep -v '^#' "$REGRESSION_RESULTS" 2>/dev/null | awk -F'\t' '{print "| " $1 " | " $2 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
